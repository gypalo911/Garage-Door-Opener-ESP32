; PlatformIO Project Configuration File
; HomeKit garage door opener for GANT-GM 800/3000 (fixed code, 433.92 MHz)
; ESP32-WROOM-32 + CC1101 + HomeSpan.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Target the USB-serial adapter (CH340 shows as cu.usbserial-* / cu.wchusbserial*).
; Avoids PlatformIO auto-selecting /dev/cu.Bluetooth-Incoming-Port on macOS.
; The exact device name can change between reconnects; override with
;   pio run -t upload --upload-port /dev/cu.usbserial-XX   if needed.
upload_port = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*
; Larger app partition (~1.9 MB) with a small SPIFFS; keeps OTA capability.
board_build.partitions = min_spiffs.csv
lib_deps =
    homespan/HomeSpan@^1.9.1
    SmartRC-CC1101-Driver-Lib@^2.5.7
